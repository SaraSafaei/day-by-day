name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - Day-by-Day-Android.zip
      - .github/workflows/build-apk.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -q Day-by-Day-Android.zip -d android-source
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build and check
        working-directory: android-source/day-by-day-android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Day-by-Day-APK
          path: android-source/day-by-day-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
